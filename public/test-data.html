<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stay Connected — Test Orders &amp; Data</title>
    <link rel="icon" type="image/jpeg" href="/logo-connected-icon.jpg">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="Stay Connected">
        <span class="brand-icon" aria-hidden="true">
          <img src="/logo-connected-icon.jpg" alt="Stay Connected Logo">
        </span>
        <span>Stay <span class="text-connected-gradient">CONNECTED</span></span>
      </a>
      <nav aria-label="Primary">
        <a href="/">Home</a>
        <a href="/test-data.html">Test data</a>
        <a href="/admin.html">Admin</a>
      </nav>
    </header>
    <div class="offer-strip">
      <span>✦</span>
      <strong>Generated Test Orders and ICCIDs</strong>
      <span>✦</span>
    </div>
    <main class="shell">
      <section class="activation-panel wide" aria-labelledby="test-title">
        <div class="brand-row">
          <div class="brand-mark" aria-hidden="true">
            <img src="/logo-connected-icon.jpg" alt="Stay Connected Emblem">
          </div>
          <div>
            <p class="eyebrow" style="color:#ff6b00;">Stay Connected Testing</p>
            <h1 id="test-title">Test Orders &amp; SIM ICCIDs</h1>
          </div>
        </div>

        <div class="test-actions">
          <a class="link-button" href="/">Open Top-Up Form</a>
          <a class="link-button secondary" href="/admin.html">Open Admin Dashboard</a>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Order ID</th>
                <th>ICCID</th>
                <th>Network</th>
                <th>Top-Up Value</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="rows">
              <tr>
                <td colspan="5">Loading...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="/test-data.js"></script>
  </body>
</html>
